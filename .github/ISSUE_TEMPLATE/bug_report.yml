name: バグ報告
description: 意図しない挙動や不具合を報告する
labels:
  - kind/bug
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。わかる範囲でできるだけ記入してください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どんなバグかを簡潔に説明してください。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: バグを再現させる手順を記載してください。
      placeholder: |
        1. '...' を開く
        2. '...' をクリックする
        3. エラーが表示される
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
      description: 本来どうなるべきかを記載してください。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動
      description: 実際に何が起きたか。スクリーンショット・ログ・スタックトレースがあれば添付してください。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: Oksskolten をどのように動かしていますか？
      value: |
        - バージョン / コミット:
        - デプロイ方法 (Docker、ローカル開発、デモ など):
        - ブラウザと OS:
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 補足
      description: 解決の助けになりそうな情報があれば記載してください。
    validations:
      required: false
