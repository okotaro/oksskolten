name: Feature Request
description: Suggest a new feature or an enhancement to existing behavior
labels:
  - kind/feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the problem you want solved before jumping to a solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Why is it needed?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have thought about.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or any other context.
    validations:
      required: false
