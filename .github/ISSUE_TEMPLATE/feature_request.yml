name: 機能リクエスト
description: 新機能や既存機能の改善を提案する
labels:
  - kind/feature
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。解決策の前に、まず解決したい課題を説明してください。

  - type: textarea
    id: problem
    attributes:
      label: 課題
      description: どんな課題を解決したいですか？なぜ必要ですか？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      description: どうなってほしいかを記載してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 考えた他の方法や回避策があれば記載してください。
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 補足
      description: モックアップ、リンク、その他の情報があれば記載してください。
    validations:
      required: false
